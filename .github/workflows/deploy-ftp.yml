name: Mettre en ligne (FTP)

# Envoi sur l'hébergement UNIQUEMENT quand tu le demandes :
# onglet Actions → « Mettre en ligne (FTP) » → Run workflow (choisis la branche, main en général) → Run workflow.
# Secrets (Settings → Secrets and variables → Actions) : FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# Variables facultatives : FTP_PROTOCOL (ftp, ftps — défaut — ou sftp), FTP_PORT (défaut 21, ou 22 en sftp),
# FTP_DIR (dossier de FabEvent vu depuis la connexion FTP, défaut « www/fabevent »),
# FTP_VERIFY_CERT (« no » si le certificat FTPS de l'hébergeur ne correspond pas à son nom).
# mail-config.php, fabevent-config.php et les données ne sont jamais envoyés ni supprimés.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Lancer les tests avant l'envoi"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les identifiants FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::error::Secret FTP_SERVER manquant : Settings → Secrets and variables → Actions (voir docs/deploiement-fabri.md)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: ${{ inputs.tests }}
        run: npm test
      - run: npm run build
      - name: Préparer le dossier fabevent/
        run: |
          mkdir -p paquet/fabevent/api
          cp -r dist/. paquet/fabevent/
          cp server/_fabevent.php server/auth.php server/sync.php server/mail.php server/public.php server/oauth.php server/lookup.php server/_specs.php server/diag.php server/mail-config.example.php server/fabevent-config.example.php server/api-htaccess.example paquet/fabevent/api/
      - name: Envoi sur l'hébergement
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ vars.FTP_PORT }}
          FTP_DIR: ${{ vars.FTP_DIR || 'www/fabevent' }}
          FTP_VERIFY_CERT: ${{ vars.FTP_VERIFY_CERT || 'yes' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
          proto=$(echo "$FTP_PROTOCOL" | tr 'A-Z' 'a-z')
          host=${FTP_SERVER#*://}; host=${host%%/*}; host=${host%%:*}   # « ftp://hote:21/ » → « hote »
          dir=${FTP_DIR%/}; [ -z "$dir" ] && dir=.
          port=$FTP_PORT; [ -z "$port" ] && { [ "$proto" = sftp ] && port=22 || port=21; }
          case "$proto" in
            sftp) url="sftp://$host:$port"; opts="set sftp:auto-confirm yes;" ;;
            ftps) url="ftp://$host:$port";  opts="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate $FTP_VERIFY_CERT;" ;;
            ftp)  url="ftp://$host:$port";  opts="set ftp:ssl-allow false;" ;;
            *) echo "::error::FTP_PROTOCOL doit valoir ftp, ftps ou sftp (actuellement : $proto)"; exit 1 ;;
          esac
          echo "Envoi en $proto vers $host:$port, dossier « $dir »"
          # 1) tout le paquet, sans jamais rien supprimer (réglages et données de l'hébergement intacts)
          # 2) assets/ : on retire aussi les anciens fichiers de build, devenus inutiles
          lftp --env-password -u "$FTP_USERNAME" "$url" -e "
            set net:timeout 25; set net:max-retries 2; set net:reconnect-interval-base 5; set ftp:passive-mode true; $opts
            mirror -R --verbose --parallel=4 --exclude-glob .git* \
              -x '^api/mail-config\.php$' -x '^api/fabevent-config\.php$' -x '^api/_donnees/' \
              paquet/fabevent/ '$dir';
            mirror -R --delete --verbose paquet/fabevent/assets/ '$dir/assets';
            bye" || {
            echo "::error::Envoi impossible ($proto, $host:$port). Vérifie dans FileZilla le protocole (FTP / FTPS / SFTP), l'hôte et le port, puis règle les variables FTP_PROTOCOL / FTP_PORT (voir docs/deploiement-fabri.md)."
            exit 1
          }
