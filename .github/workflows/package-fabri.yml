name: Paquet pour l'hébergement FABRI.live

# À chaque mise à jour de main : un zip prêt à déposer sur l'hébergement (dossier fabevent/ = l'application + api/ :
# _fabevent.php, auth.php, sync.php, mail.php, public.php…) : onglet Actions → dernière exécution → Artifacts.
# Mise en ligne directe par FTP, quand tu le décides : workflow « Mettre en ligne (FTP) » (deploy-ftp.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          mkdir -p paquet/fabevent/api
          cp -r dist/. paquet/fabevent/
          cp server/sync.php paquet/fabevent/api/sync.php
          cp server/_fabevent.php server/auth.php server/mail.php server/public.php server/oauth.php server/lookup.php server/diag.php server/mail-config.example.php server/fabevent-config.example.php server/api-htaccess.example paquet/fabevent/api/
          cp docs/deploiement-fabri.md paquet/LISEZMOI.md
      - uses: actions/upload-artifact@v4
        with:
          name: fabevent-fabri
          path: paquet
